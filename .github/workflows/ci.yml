name: CI

on:
  push:
    branches: [main]
  pull_request:

# Το token του CI χρειάζεται μόνο ανάγνωση του κώδικα.
permissions:
  contents: read

# Ακύρωση παλαιότερου run όταν έρθει νέο push στο ίδιο branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
